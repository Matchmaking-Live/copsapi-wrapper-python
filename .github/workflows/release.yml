name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Check the tag matches the package version
        run: |
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          runtime=$(python -c "import copsapi; print(copsapi.__version__)")
          if [ "v$project" != "$GITHUB_REF_NAME" ] || [ "$runtime" != "$project" ]; then
            echo "Tag $GITHUB_REF_NAME, pyproject.toml $project and copsapi.__version__ $runtime must all match."
            exit 1
          fi
      - run: python scripts/generate_sync.py --check
      - run: python -m pytest -q
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/copsapi-wrapper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
